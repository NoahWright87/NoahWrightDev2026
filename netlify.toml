[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_CLARITY_ID"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Only the resume downloads, saved under a name a recruiter will recognise. The
# award citations under /documents/ open in the browser from their "View
# citation" links.
[[headers]]
  for = "/noah-wright-resume.pdf"
  [headers.values]
    Content-Disposition = 'attachment; filename="Noah-Wright-Resume.pdf"'
